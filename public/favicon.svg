<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ambientPurple" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#5B21B6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0A0C14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161926"/>
      <stop offset="50%" stop-color="#0D101A"/>
      <stop offset="100%" stop-color="#080A11"/>
    </linearGradient>
    <linearGradient id="bronzeChamfer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="titaniumWing" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#CBD5E1"/>
      <stop offset="65%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="innerShadowWing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <!-- Matte Brushed Titanium Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgMetal)"/>
  <rect width="496" height="496" x="8" y="8" rx="110" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="4"/>
  <!-- Ambient Purple Rim Glow -->
  <circle cx="256" cy="240" r="210" fill="url(#ambientPurple)"/>
  <!-- Outer Bronze/Copper Chamfered Monolith V -->
  <polygon points="68,148 192,148 256,262 320,148 444,148 392,184 256,396 120,184" fill="url(#bronzeChamfer)"/>
  <!-- Inner Dark Bevel -->
  <polygon points="88,156 186,156 256,280 326,156 424,156 380,186 256,380 132,186" fill="url(#innerShadowWing)"/>
  <!-- Brushed Titanium Main V Shield -->
  <polygon points="106,156 182,156 256,288 330,156 406,156 364,184 256,356 148,184" fill="url(#titaniumWing)"/>
</svg>
